<body class="bg-surface font-body-lg text-on-surface min-h-screen flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="flex-grow flex items-center justify-center px-margin-mobile py-12">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl ambient-shadow p-8 md:p-10 border border-outline-variant/30 flex flex-col items-center">
<!-- Branding Header -->
<div class="mb-10 text-center">
<img alt="RoofStead" class="h-16 w-auto mx-auto mb-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYLK3Y_heWwdbz8MnGk0ejaG8638fXGHl0kWPVjtf3D-pfvW-NYsv3qhHGza3MnnijtMUh8690-zzdvb_p2h0TLNlOK2NkY2QiPBS8HIJNMCeBoAq5qks0IaVLKG1JkuQ8t6WK06lzOLfVeBYxvI69vyCNwLCTuwa5qB_ObfdkmbBmoKAwc6AyMmXvAa0vT-NVQ4SI9Nd_9clt0tQLaveB4BE4XWAwL9GeiDmLIQjFivkVqxqmb3X7aw"/>
<h1 class="font-headline-md text-headline-md text-primary mb-2">Create your account</h1>
<p class="font-body-md text-on-surface-variant">Experience a more transparent way to find home.</p>
</div>
<!-- Sign-up Form -->
<form action="#" class="w-full space-y-6" method="POST">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="full-name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline-variant rounded-lg font-body-md text-on-surface form-input-focus transition-all placeholder:text-outline-variant" id="full-name" name="full-name" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline-variant rounded-lg font-body-md text-on-surface form-input-focus transition-all placeholder:text-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider block" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-transparent border border-outline-variant rounded-lg font-body-md text-on-surface form-input-focus transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<p class="font-label-md text-[10px] text-outline text-right mt-1">Must be at least 8 characters</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start space-x-3 py-2">
<input class="mt-1 h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="terms" name="terms" required="" type="checkbox"/>
<label class="font-body-md text-on-surface-variant text-xs leading-relaxed" for="terms">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Action Button -->
<button class="w-full bg-primary text-on-primary font-title-lg text-title-lg py-4 rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Social/Login Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="h-[1px] flex-grow bg-outline-variant/50"></div>
<span class="font-label-md text-on-surface-variant">OR</span>
<div class="h-[1px] flex-grow bg-outline-variant/50"></div>
</div>
<!-- Login Link -->
<div class="text-center">
<p class="font-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Sign In</a>
</p>
</div>
</div>
</main>
<!-- Global Subtle Footer Info -->
<footer class="w-full py-8 px-margin-desktop text-center">
<div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-4 border-t border-outline-variant/20 pt-8">
<p class="font-label-md text-on-surface-variant/70">
                © 2024 RoofStead Real Estate. Licensed Brokerage.
            </p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-md text-primary uppercase tracking-widest text-[10px]">Bank-Level Security</span>
</div>
</div>
</footer>
<script>
        // Micro-interaction for button scaling
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Floating label behavior can be added here if needed, 
        // but modern minimalist clean placeholder look is chosen per style guidance.
    </script>
